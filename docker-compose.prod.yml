services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      PORT: "4000"
      UPLOAD_DIR: /app/uploads
      # External MongoDB only (no mongodb container in this stack)
      MONGODB_URI: 'mongodb://root:C0d3%40n%24%402026@45.132.241.96:32768/autoqr?authSource=admin'
      CLIENT_URL: 'http://45.132.241.96:8180'
      PUBLIC_BASE_URL: 'http://45.132.241.96:8180'
      CORS_ORIGINS: 'http://45.132.241.96:8180,http://45.132.241.96'
      JWT_ACCESS_SECRET: '3IFV5bycExZ2eeo54mFh813K0MZMLKynOBnFGLzVxDA='
      JWT_REFRESH_SECRET: 'jtdQs/nxXe0hTOpMf07kp4H5XnvJdOj8jmbTy9G3dZY='
    restart: unless-stopped
    volumes:
      - autoqr_uploads:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: 'http://45.132.241.96:8180/api'
        VITE_SOCKET_URL: 'http://45.132.241.96:8180'
        VITE_WEBRTC_ICE_SERVERS: '[{"urls":"stun:stun.l.google.com:19302"}]'
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./infra/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Single edge port — nginx proxies /, /api, /socket.io, /uploads
      - "8180:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  autoqr_uploads:

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't gzip video — wastes CPU and can break Range requests.
  gzip off;

  # Hashed Vite assets: long cache + Range support for scroll-driven video.
  location ~* ^/assets/.+\.(mp4|webm|mov|m4v)$ {
    add_header Accept-Ranges bytes;
    add_header Cache-Control "public, immutable, max-age=31536000";
    expires 1y;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio on;
    output_buffers 2 1m;
    try_files $uri =404;
  }

  # Other hashed Vite assets (JS, CSS, images): long cache.
  location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|webp|avif|gif|ico)$ {
    add_header Cache-Control "public, immutable, max-age=31536000";
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
